name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'zulu'
          cache: 'maven'

      - name: Build & Test
        working-directory: backend
        run: ./mvnw.cmd verify -B -DnvdApiKey=%NVD_API_KEY%
        env:
          OPENROUTER_API_KEY: ci-placeholder
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html

      - name: Fetch full git history
        shell: cmd
        run: git fetch --unshallow 2>nul || echo Already full depth or no remote

      - name: SonarQube Scan
        working-directory: backend
        shell: powershell
        run: ./mvnw.cmd sonar:sonar "-Dsonar.host.url=http://localhost:9000" "-Dsonar.token=$env:SONAR_TOKEN" "-Dsonar.qualitygate.wait=true" "-DnvdApiKey=$env:NVD_API_KEY"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

