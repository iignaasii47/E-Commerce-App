name: Renovate
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          docker run --rm \
            --user $(id -u):$(id -g) \
            -e RENOVATE_REPOSITORIES=${{ github.repository }} \
            -e RENOVATE_TOKEN \
            -e RENOVATE_BASE_DIR=/tmp/renovate-${{ github.run_id }} \
            -v /tmp:/tmp \
            ghcr.io/renovatebot/renovate:latest

      - name: Cleanup renovate temp files
        if: always()
        run: rm -rf /tmp/renovate-${{ github.run_id }}
