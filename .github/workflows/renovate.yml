name: Renovate
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: self-hosted
    env:
      RENOVATE_REPOSITORIES: ${{ github.repository }}
      RENOVATE_BASE_DIR: /tmp/renovate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare renovate cache
        run: rm -rf /tmp/renovate && mkdir -p /tmp/renovate && chmod 777 /tmp/renovate

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v41.0.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
