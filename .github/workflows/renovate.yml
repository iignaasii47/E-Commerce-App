name: Renovate
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
jobs:
  renovate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Renovate
        run: npx renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
