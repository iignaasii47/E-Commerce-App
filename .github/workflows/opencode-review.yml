name: opencode-review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Debug secret
        run: |
          if [ -n "$OPENCODE_API_KEY" ]; then
            echo "OPENCODE_API_KEY is set (length: ${#OPENCODE_API_KEY})"
          else
            echo "ERROR: OPENCODE_API_KEY is empty or not set"
          fi
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: >
            Review this pull request. Check for: potential bugs, logic errors,
            incorrect behavior, edge cases, and code that can be optimized
            for performance or clarity. Post your findings as a structured review.
