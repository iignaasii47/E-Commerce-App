name: opencode-review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load .env
        run: |
          if [ -f .env ]; then
            echo "OPENCODE_API_KEY=$(grep '^OPENCODE_API_KEY=' .env | cut -d '=' -f2-)" >> "$GITHUB_ENV"
          fi

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ env.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: >
            Review this pull request. Check for: potential bugs, logic errors,
            incorrect behavior, edge cases, and code that can be optimized
            for performance or clarity. Post your findings as a structured review.
