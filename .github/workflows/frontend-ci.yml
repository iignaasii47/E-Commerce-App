name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Test with coverage
        working-directory: frontend
        run: npx ng test --watch=false --coverage --coverage-reporters lcov

      - name: Build
        working-directory: frontend
        run: npx ng build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: frontend/coverage/

      - name: Fetch full git history
        shell: bash
        run: git fetch --unshallow 2>/dev/null || echo Already full depth or no remote

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'zulu'

      - name: SonarQube Scan
        working-directory: frontend
        run: npx sonar-scanner "-Dsonar.qualitygate.wait=true"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
