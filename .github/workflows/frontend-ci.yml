name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Test with coverage
        working-directory: frontend
        run: npx ng test --watch=false --coverage --coverage-reporters lcov

      - name: Build
        working-directory: frontend
        run: npx ng build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: frontend/coverage/

      - name: Fetch full git history
        run: if (git rev-parse --is-shallow-repository 2>$null) { git fetch --unshallow 2>$null } else { echo "Already full depth or no remote" }

      - name: SonarQube Scan
        working-directory: frontend
        run: npx sonar-scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Get frontend diff (for PR review)
        if: github.event_name == 'pull_request'
        id: diff
        shell: powershell
        run: |
          $diff = git diff origin/${{ github.base_ref }}...HEAD -- frontend/
          if (-not $diff) {
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $diff | Out-File frontend-diff.txt -Encoding utf8
          "skip=false" >> $env:GITHUB_OUTPUT

      - name: Run opencode review
        if: github.event_name == 'pull_request' && steps.diff.outputs.skip == 'false'
        shell: powershell
        run: |
          $prompt = @'
          Review the following frontend PR diff. Focus on finding:
           1. Bugs and logic errors that could cause runtime failures
           2. Security vulnerabilities (XSS, CSRF, insecure data handling, etc.)
           3. Performance issues (unnecessary re-renders, large bundles, memory leaks, etc.)
           4. Code quality issues (antipatterns, error handling gaps, accessibility problems, etc.)

          For each issue found:
           - Specify the exact file path and line number
           - Assign a severity: "critical" (must fix), "warning" (should fix), or "info" (consider improving)
           - Provide a clear, actionable description

          At the very end of your response, output a JSON array wrapped in ```json ... ``` markers.
          Each element in the array must have exactly these four fields:
           - file (string): the file path relative to repo root
           - line (number): the exact line number
           - severity (string): "critical", "warning", or "info"
           - message (string): a concise description of the issue

          Example:
          ```json
          [
            { "file": "frontend/src/app/components/login.component.ts", "line": 25, "severity": "critical", "message": "User input is not sanitized before being rendered. This could lead to XSS attacks." }
          ]
          ```

          If no issues are found, return an empty array: []
          '@
          $result = opencode run -m opencode/big-pickle $prompt -f frontend-diff.txt 2>$null
          $result | Out-File review-full.txt -Encoding utf8
          if ($result -match '```json\s*(\[[\s\S]*?\])\s*```') {
            $matches[1] | Out-File review-issues.json -Encoding utf8
          }

      - name: Post PR review with per-line comments
        if: github.event_name == 'pull_request' && steps.diff.outputs.skip == 'false'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $full = Get-Content review-full.txt -Raw

          $issues = @()
          if (Test-Path review-issues.json) {
            try {
              $issues = Get-Content review-issues.json -Raw | ConvertFrom-Json
            } catch {
              $issues = @()
            }
          }

          $body = "## Frontend OpenCode Review (opencode/big-pickle)`n`n$full"

          $comments = $issues | ForEach-Object {
            @{
              path = $_.file
              line = [int]$_.line
              body = "**[$($_.severity)]** $($_.message)"
            }
          }

          $review = @{
            body = $body
            event = "COMMENT"
            comments = @($comments)
          } | ConvertTo-Json -Compress -Depth 10

          $review | Out-File review-payload.json -Encoding utf8 -NoNewline
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --input review-payload.json
