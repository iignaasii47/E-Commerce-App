spring.application.name=e-commerce-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGeneration1234567890}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.api-url=https://openrouter.ai/api/v1
openrouter.model=meta-llama/llama-3.3-70b-instruct:free
openrouter.fallback-models=google/gemma-4-31b-it:free,nvidia/nemotron-3-ultra-550b-a55b:free,google/gemma-4-26b-a4b-it:free,nvidia/nemotron-3-super-120b-a12b:free,qwen/qwen3-next-80b-a3b-instruct:free,nvidia/nemotron-3-nano-30b-a3b:free,openai/gpt-oss-20b:free,nvidia/nemotron-nano-9b-v2:free,meta-llama/llama-3.2-3b-instruct:free

password.min-length=8
password.require-mixed=true
