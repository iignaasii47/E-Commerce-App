spring.application.name=e-commerce-api

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce-db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=false
spring.sql.init.mode=always

jwt.secret=mySecretKeyForJWTTokenGeneration1234567890
jwt.expiration-ms=86400000

openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.api-url=https://openrouter.ai/api/v1
openrouter.model=meta-llama/llama-3.3-70b-instruct:free
openrouter.fallback-models=google/gemma-4-31b-it:free,nvidia/nemotron-3-ultra-550b-a55b:free,google/gemma-4-26b-a4b-it:free,nvidia/nemotron-3-super-120b-a12b:free,qwen/qwen3-next-80b-a3b-instruct:free,nvidia/nemotron-3-nano-30b-a3b:free,openai/gpt-oss-20b:free,nvidia/nemotron-nano-9b-v2:free,meta-llama/llama-3.2-3b-instruct:free
