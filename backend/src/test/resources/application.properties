spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.sql.init.mode=never

jwt.secret=test-secret-key-for-jwt-token-generation-test123
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

openrouter.api-key=test-key
openrouter.api-url=https://openrouter.ai/api/v1
openrouter.model=meta-llama/llama-3.3-70b-instruct:free
openrouter.fallback-models=google/gemma-4-31b-it:free,nvidia/nemotron-3-super-120b-a12b:free

password.min-length=8
password.require-mixed=true

rate-limit.login=5
rate-limit.registration=3
rate-limit.token-refresh=10
rate-limit.chat=30
rate-limit.window-seconds=60